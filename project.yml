name: TermLaunch
options:
  bundleIdPrefix: dev.termlaunch
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  TermLaunch:
    type: application
    platform: macOS
    sources:
      - Sources/TermLaunch
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/terminfo
        type: folder
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    dependencies:
      # Linked, not embedded: embedding breaks signing on non-Developer-ID builds.
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
        link: true
      - sdk: libc++.tbd
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
    info:
      path: Sources/TermLaunch/Info.plist
      properties:
        CFBundleName: TermLaunch
        CFBundleShortVersionString: "0.27"
        CFBundleVersion: "4"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.termlaunch.app
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  TermLaunchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TermLaunchTests
      # Pure-logic files compiled straight in: no app host, no GhosttyKit.
      - Sources/TermLaunch/TOML.swift
      - Sources/TermLaunch/Config.swift
      - Sources/TermLaunch/KeySpec.swift
      - Sources/TermLaunch/ShellCommand.swift
      - Sources/TermLaunch/Presentation.swift
      - Sources/TermLaunch/ChordKeys.swift
      - Sources/TermLaunch/ChordController.swift
      - Sources/TermLaunch/LauncherKeys.swift
      - Sources/TermLaunch/TerminalShortcut.swift
      - Sources/TermLaunch/TabShortcut.swift
      - Sources/TermLaunch/Frecency.swift
      - Sources/TermLaunch/FuzzyScorer.swift
      - Sources/TermLaunch/AppIndex.swift
      - Sources/TermLaunch/Calc.swift
      - Sources/TermLaunch/LauncherModel.swift
      - Sources/TermLaunch/TabList.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  TermLaunch:
    build:
      targets:
        TermLaunch: all
    test:
      targets: [TermLaunchTests]
